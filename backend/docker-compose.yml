version: '3.8'

services:
  # Primary Express API Container
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ab_awareness_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/abawareness?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=production_super_secret_jwt_access_key_2026!
      - JWT_REFRESH_SECRET=production_super_secret_jwt_refresh_key_2026!
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Dedicated Background Worker Container
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ab_awareness_worker
    command: ["node", "dist/jobs/worker.runner.js"]
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/abawareness?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # PostgreSQL Database Container
  postgres:
    image: postgres:16-alpine
    container_name: ab_awareness_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: abawareness
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Messaging Container
  redis:
    image: redis:7-alpine
    container_name: ab_awareness_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
